[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayesh"
version = "0.1.0"
description = "Multi-agent AI orchestrator (Indonesian) — Ayesh"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Ayesh Team", email = "dev@ayesh.local" }]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "pydantic>=2.13.5",
    "httpx>=0.28.1",
    "langchain-core>=1.6.3",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.2",
    "langchain-ollama>=1.1.0",
    "langchain-anthropic>=1.0",
    "langchain-cohere>=0.6",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "mcp>=1.30.0",
    "requests>=2.34.2",
    "langgraph>=1.2.11",
    "google-genai>=2.24.0",
    "SQLAlchemy>=2.0.53",
    "psycopg2-binary>=2.9.13",
    "cryptography>=44.0.0",
    "alembic>=1.20.0",
    "redis>=8.1.0",
    "python-dotenv>=1.2.3",
    "aiogram>=3.31.0",
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "factory-boy>=3.3.0",
    "pytest-factoryboy>=2.4.0",
    "locust>=2.40.0",
    "mutmut>=3.8.0,<3",
    "openpyxl>=3.1.5",
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/adhitiad/ayesh"
Repository = "https://github.com/adhitiad/ayesh"
Issues = "https://github.com/adhitiad/ayesh/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.ruff]
target-version = "py313"
line-length = 120
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "PIE",
    "T20",
    "ARG",
    "PTH",
    "ERA",
    "PD",
    "PL",
    "TRY",
]
ignore = [
    "S101",   # assert in tests
    "B008",   # function calls in default args (common in tools)
    "B011",   # assert in tests
    "TRY003", # avoid broad except in non-test code (legacy)
]
[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["S101", "B011", "TRY003"]
"src/core/llm/providers/*.py" = ["ARG001", "ARG002"]
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
strict_optional = true
check_untyped_defs = false
allow_untyped_globals = true
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "dict-item",
    "index",
    "list-item",
    "misc",
    "name-defined",
    "no-untyped-def",
    "operator",
    "return-value",
    "union-attr",
    "valid-type",
    "var-annotated",
]
exclude = ["venv", ".venv", "build", "dist", "*.egg-info"]

[[tool.mypy.overrides]]
module = [
    "src.core.llm.providers.*",
    "langchain*",
    "google*",
    "mcp*",
    "pydantic*",
    "fastapi*",
    "uvicorn*",
    "redis*",
    "sqlalchemy*",
    "alembic*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B110", "B311", "B603", "B607"]
targets = ["src"]

[tool.mutmut]
# Mutation testing (mutmut 2.x — v3 butuh WSL di Windows, issue boxed/mutmut#397).
# Default: satu modul baseline. Untuk modul lain: mutmut run --paths-to-mutate src/...
# runner pakai interpreter venv eksplisit (shell=True di Windows); di Linux/WSL
# override: --runner "venv/bin/python -m pytest -x --assert=plain".
paths_to_mutate = "src/core/llm/task_routing.py"
runner = 'venv\Scripts\python.exe -m pytest -x --assert=plain'


[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "bandit>=1.8",
    "httpx>=0.28.1",
    "pytest-mock>=3.14",
]
